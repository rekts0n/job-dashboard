<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jobs">
<title>Job Hunt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236ea8fe'/%3E%3Cpath d='M20 24h24v22H20z' fill='none' stroke='%230b1220' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M26 24v-5h12v5' fill='none' stroke='%230b1220' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%236ea8fe'/%3E%3Cpath d='M20 24h24v22H20z' fill='none' stroke='%230b1220' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M26 24v-5h12v5' fill='none' stroke='%230b1220' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-box" autocomplete="on">
    <h1>Job Hunt</h1>
    <p class="muted">Enter your passphrase to unlock.</p>
    <input type="text" name="username" value="job-dashboard" autocomplete="username" hidden>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" required>
    <label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button id="unlockBtn" class="btn primary" type="submit">Unlock</button>
    <p id="lockErr" class="err" role="alert"></p>
  </form>
</div>

<header class="top">
  <div class="bar">
    <h1>Job Hunt</h1>
    <span id="status" class="muted small"></span>
    <button id="refreshBtn" class="icon-btn" title="Check for new data" aria-label="Refresh">&#x21bb;</button>
    <button id="lockBtn" class="icon-btn" title="Lock" aria-label="Lock">&#x1f512;&#xfe0e;</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="review">Review <span class="count" id="cReview"></span></button>
    <button class="tab" data-tab="apps">Applications <span class="count" id="cApps"></span></button>
    <button class="tab" data-tab="insights">Insights</button>
  </nav>
</header>

<main>
  <section id="tab-review" class="panel" hidden>
    <div class="seg" role="tablist">
      <button data-view="todo">To review</button>
      <button data-view="shortlist">Shortlist</button>
      <button data-view="all">All jobs</button>
    </div>
    <div id="allTools" class="all-tools" hidden>
      <input id="q" type="search" placeholder="Search jobs, companies…" autocomplete="off">
      <label class="check"><input type="checkbox" id="fOpen" checked> Open only</label>
      <label class="check"><input type="checkbox" id="fNear"> Near misses</label>
      <label class="check"><input type="checkbox" id="fOld"> Old Hermes matches</label>
      <label class="check"><input type="checkbox" id="fSkipped"> Not-for-me</label>
    </div>
    <p id="listHint" class="hint"></p>
    <div id="list" class="list"></div>
  </section>

  <section id="tab-apps" class="panel" hidden>
    <div id="apps"></div>
  </section>

  <section id="tab-insights" class="panel" hidden>
    <div id="insights"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
